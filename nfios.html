<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="iosp.pageTitle">NeverFap on iOS</title>
    <meta name="description" content="Install NeverFap on your iPhone in six steps with Safari's Add to Home Screen. No App Store needed." />
    <meta property="og:title" content="NeverFap on iOS" />
    <meta property="og:description" content="Install NeverFap on your iPhone in six steps with Safari's Add to Home Screen. No App Store needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neverfap.tommfr38.com/nfios.html" />
    <meta property="og:image" content="https://neverfap.tommfr38.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- maintenance mode redirect -->
    <script src="./config.js"></script>
    <script src="./i18n.js?v=6"></script>
    <script src="./maintenance-check.js?v=4"></script>

    <!-- Tailwind (CDN) -->
    <script src="./vendor/tailwindcss-3.4.17.js?v=1"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              glow: "0 0 0 1px rgba(255,255,255,0.10), 0 0 24px rgba(99,102,241,0.25)",
            },
          },
        },
      };
    </script>

    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./site.css?v=1" />
    <script src="./site.js?v=1" defer></script>
  </head>

  <body class="min-h-screen text-white antialiased">
<!-- Background -->
<div class="fixed inset-0 -z-10">
  <!-- Base gradient -->
  <div class="absolute inset-0 bg-gradient-to-b from-[#140802] via-[#0f0602] to-[#060301]"></div>

  <!-- Vertical warmth -->
  <div class="absolute inset-0 bg-gradient-to-t from-orange-500/10 via-transparent to-transparent"></div>

  <!-- Subtle grain texture -->
  <div
    class="absolute inset-0 opacity-[0.08]"
    style="
      background-image: url('data:image/svg+xml;utf8,\
      <svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22>\
      <filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%224%22/></filter>\
      <rect width=%22100%22 height=%22100%22 filter=%22url(%23n)%22 opacity=%220.4%22/>\
      </svg>');
    "
  ></div>
</div>

    <main class="mx-auto max-w-4xl px-4 py-12">
      <!-- Title -->
      <div class="flex items-start justify-between gap-4">
        <div>
          <h1 data-i18n="iosp.title" class="text-3xl font-extrabold tracking-tight">
            NeverFap on iOS
          </h1>

          <p data-i18n="iosp.sub" class="mt-2 text-sm text-white/50">
            Use NeverFap on iPhone via Safari — no App Store required.
          </p>
        </div>

        <!-- Language picker (i18n.js mounts the select in here) -->
        <div data-nf-lang class="shrink-0"></div>
      </div>

      <!-- Steps -->
      <div class="mt-10 space-y-10">

        <!-- Step 1 -->
        <div class="relative">
          <p data-i18n="iosp.s1" class="mb-3 text-sm text-white/50">
            Search for NeverFap in Safari
          </p>

          <a href="#"
             class="block h-56 w-full rounded-3xl bg-white/5 shadow-glow transition hover:bg-white/10 active:scale-[0.99]">
            <img
              src="./step1nfios.jpeg"
              alt="Search for NeverFap in Safari"
              data-i18n-attr="alt:iosp.s1"
              class="h-full w-full object-contain p-4"
            />
          </a>

          <div class="absolute left-1/2 top-full h-10 w-px -translate-x-1/2 bg-white/20"></div>
        </div>

        <!-- Step 2 -->
        <div class="relative">
          <p data-i18n="iosp.s2" class="mb-3 text-sm text-white/50">
            Click the three-dots menu
          </p>

          <a href="#"
             class="block h-56 w-full rounded-3xl bg-white/5 shadow-glow transition hover:bg-white/10 active:scale-[0.99]">
            <img
              src="./step2nfios.jpeg"
              alt="Open Safari menu"
              data-i18n-attr="alt:iosp.s2alt"
              class="h-full w-full object-contain p-4"
            />
          </a>

          <div class="absolute left-1/2 top-full h-10 w-px -translate-x-1/2 bg-white/20"></div>
        </div>

        <!-- Step 3 -->
        <div class="relative">
          <p data-i18n="iosp.s3" class="mb-3 text-sm text-white/50">
            Select Share
          </p>

          <a href="#"
             class="block h-72 w-full rounded-3xl bg-white/5 shadow-glow transition hover:bg-white/10 active:scale-[0.99]">
            <img
              src="./step3nfios.jpeg"
              alt="Tap Share"
              data-i18n-attr="alt:iosp.s3alt"
              class="h-full w-full object-contain p-4"
            />
          </a>

          <div class="absolute left-1/2 top-full h-10 w-px -translate-x-1/2 bg-white/20"></div>
        </div>

        <!-- Step 4 -->
        <div class="relative">
          <p data-i18n="iosp.s4" class="mb-3 text-sm text-white/50">
            Select “Add to Home Screen”
          </p>

          <a href="#"
             class="block h-[550px] w-full rounded-3xl bg-white/5 shadow-glow transition hover:bg-white/10 active:scale-[0.99]">
            <img
              src="./step4nfios.jpeg"
              alt="Add to Home Screen"
              data-i18n-attr="alt:iosp.s4alt"
              class="h-full w-full object-contain p-4"
            />
          </a>

          <div class="absolute left-1/2 top-full h-10 w-px -translate-x-1/2 bg-white/20"></div>
        </div>

        <!-- Step 5 -->
        <div class="relative">
          <p data-i18n="iosp.s5" class="mb-3 text-sm text-white/50">
            Confirm and add
          </p>

          <a href="#"
             class="block h-[550px] w-full rounded-3xl bg-white/5 shadow-glow transition hover:bg-white/10 active:scale-[0.99]">
            <img
              src="./step5nfios.jpeg"
              alt="Confirm adding to Home Screen"
              data-i18n-attr="alt:iosp.s5alt"
              class="h-full w-full object-contain p-4"
            />
          </a>

          <div class="absolute left-1/2 top-full h-10 w-px -translate-x-1/2 bg-white/20"></div>
        </div>

        <!-- Step 6 -->
        <div>
          <p data-i18n="iosp.s6" class="mb-3 text-sm text-white/50">
            Launch from your Home Screen
          </p>

          <a href="#"
             class="block h-72 w-full rounded-3xl bg-white/5 shadow-glow transition hover:bg-white/10 active:scale-[0.99]">
            <img
              src="./step6nfios.jpeg"
              alt="Launch NeverFap"
              data-i18n-attr="alt:iosp.s6alt"
              class="h-full w-full object-contain p-4"
            />
          </a>
        </div>

      </div>

      <footer data-i18n="iosp.footer" class="mt-12 text-center text-xs text-white/40">
        iOS support via Progressive Web App (PWA)
      </footer>
    <div data-nf-legal></div>
    </main>
  </body>
</html>
