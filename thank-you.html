<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="thanks.pageTitle">Welcome • NeverFap</title>
    <meta name="description" content="Your NeverFap account is ready. Light your flame and start your streak." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0503" />

    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./site.css?v=1" />

    <script src="./config.js"></script>
    <script src="./v2/i18n.js?v=7"></script>
    <script src="./site.js?v=1" defer></script>
  </head>

  <body class="nfx-page">
    <main class="nfx-wrap">
      <a class="nfx-brand" href="./">
        <img src="./icon-192.png" alt="" width="32" height="32" />
        NeverFap
      </a>

      <div class="nfx-center">
        <span class="nfx-code" data-i18n="thanks.kicker">DAY ONE</span>
        <h1 data-i18n="thanks.title">Thank you for starting.</h1>
        <p data-i18n="thanks.sub">Your account is ready. If we sent you a confirmation email, open its link first, then come back and log in.</p>
        <a class="nfx-btn nfx-btn--primary" href="./" data-i18n="thanks.cta">Open NeverFap</a>
      </div>

      <div data-nf-legal></div>
    </main>
  </body>
</html>
